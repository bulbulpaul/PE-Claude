# PySwarms logging configuration for Docker/CloudWatch
# Uses StreamHandler only (no file handlers) for container environments
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

handlers:
  default:
    level: INFO
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

loggers:
  "":
    handlers: [default]
    level: INFO
    propagate: true
